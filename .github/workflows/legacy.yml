name: Minecraft 1.5.2
on:
  push:
    paths: ['legacy/**', '.github/workflows/legacy.yml', 'LICENSE*']
  pull_request:
    paths: ['legacy/**', '.github/workflows/legacy.yml', 'LICENSE*']
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15-intel, macos-14, ubuntu-24.04-arm, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test native controller backend
        shell: bash
        working-directory: legacy
        run: bash ./gradlew build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controllable-1.5.2-${{ matrix.os }}
          path: |
            legacy/build/libs/*
            legacy/build/reports/tests/test/**
